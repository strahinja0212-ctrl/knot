<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF9">
<title>Knot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Colour palettes. Each one is a full set of colours; applyTheme writes them onto <html> as CSS variables.
// Keys: bg, side (sidebar), card, surface (inputs, raised bits), line, line2, row, soft, ink, ink2, mute, faint, ring, acc, onAcc (text on accent).
const K = 'bg side card surface line line2 row soft ink ink2 mute faint ring acc'.split(' ');
const pal = (name, group, v, onAcc, fx, sky) => ({ name, group, onAcc, fx, sky: sky ? sky.split(' ') : null, ...Object.fromEntries(K.map((k, i) => [k, v.split(' ')[i]])) });
// Night-only palettes. group k = Knot originals, c = community editor themes (open source palettes).
const PALETTES = {
  // group a = aurora: neon palettes. Last field = 4 glow colours (the 3rd is the gradient partner of the accent).
  'aurora': pal('Aurora', 'a', '#0A0F1E #0E1426 #121A30 #1D253A #232B41 #30384D #21293E #232B41 #E8F0FF #C8D0E0 #979FB0 #798193 #565E72 #7CFFB2', '#05200F', 'glow', '#22D3A6 #7C3AED #38BDF8 #A3E635'),
  'borealis': pal('Borealis', 'a', '#04121A #061923 #0A2230 #12303F #173646 #22455A #153345 #173646 #E3FBF4 #C1DDD6 #8FB0AA #72928D #52716E #34F5C5', '#01241B', 'glow', '#10B981 #06B6D4 #8B5CF6 #22C55E'),
  'nebula': pal('Nebula', 'a', '#0E0718 #130A20 #190E2A #241838 #2A1D40 #382A50 #27193C #2A1D40 #F5EAFF #D9CBE6 #A897B8 #8A7A9B #66577A #E879F9', '#2A0530', 'glow', '#C026D3 #6D28D9 #2563EB #DB2777'),
  'lagoon': pal('Lagoon', 'a', '#031417 #051B1F #082429 #113137 #16373D #22464C #143439 #16373D #E0FBFC #BFDCDE #8DAEB1 #6F9093 #4E6F72 #22D3EE', '#02242A', 'glow', '#0891B2 #14B8A6 #3B82F6 #2DD4BF'),
  'glacier': pal('Glacier', 'a', '#070D18 #0A1220 #0F182A #1A2437 #1F2A3E #2C374C #1D283B #1F2A3E #EEF4FF #CED7E8 #9CA7BC #7E899E #5C677C #93C5FD', '#0A1A33', 'glow', '#60A5FA #A78BFA #67E8F9 #C4B5FD'),
  'twilight': pal('Twilight', 'a', '#100B1E #150F27 #1B1432 #261F40 #2C2447 #3A3156 #292144 #2C2447 #F1EDFF #D3CDE6 #A39CB8 #857E9A #635C78 #FBBF24', '#2A1A00', 'glow', '#4F46E5 #C026D3 #F59E0B #7C3AED'),
  'ember': pal('Ember', 'a', '#160A0A #1D0D0D #251212 #321C1B #382120 #462E2C #351F1E #382120 #FFECE6 #E2C9C2 #B39890 #937A73 #6E5752 #FB7185', '#2A0610', 'glow', '#F97316 #E11D48 #A21CAF #F59E0B'),
  'sakura': pal('Sakura Night', 'a', '#150A12 #1B0D17 #22111D #2E1C28 #34212E #422E3B #31202C #34212E #FFEAF4 #E2C8D6 #B396A6 #937887 #6F5664 #F9A8D4', '#2E0A1E', 'glow', '#EC4899 #F472B6 #A855F7 #FB7185'),
  'graphite': pal('Graphite', 'k', '#141416 #19191C #1F1F23 #2A2A2E #303034 #3D3D40 #2E2E32 #303034 #F4F4F5 #D4D4D6 #A3A3A5 #858588 #636366 #818CF8', '#0B0B1A', ''),
  'midnight': pal('Midnight', 'k', '#05070D #090C16 #0E1322 #191E2D #1F2433 #2D3140 #1D2231 #1F2433 #E8ECF6 #C7CBD6 #959AA5 #777B88 #545866 #5850EC', '#FFFFFF', ''),
  'cyberpunk': pal('Cyberpunk', 'k', '#08080F #0C0C15 #11111C #1C1D27 #22242E #2F323C #20212C #22242E #EAFBFF #C9D8DD #98A2A9 #798189 #565C65 #FCEE0A', '#0A0A12', 'glow sharp'),
  'synthwave': pal('Synthwave', 'k', '#150A24 #1A0E2C #211236 #2C1D40 #322346 #403052 #302144 #322346 #FBEAFF #DACAE1 #A898B3 #8A7A96 #675776 #FF4FD8', '#1A0420', 'glow'),
  'matrix': pal('Matrix', 'k', '#000500 #010A04 #03110A #0C1D14 #112419 #1C3225 #102217 #112419 #B8FFC9 #9DDBAC #73A580 #5A8366 #3D5D47 #00FF66', '#001A08', 'glow mono sharp'),
  'amber': pal('Amber CRT', 'k', '#0D0900 #120C02 #171005 #231A0D #2A2011 #372C1B #271E10 #2A2011 #FFD9A0 #DCBB89 #A78D65 #86704F #615037 #FFB000', '#1A1000', 'glow mono'),
  'vampire': pal('Vampire', 'k', '#0B0507 #11070B #180A0F #23151A #2A1B20 #37292D #27191E #2A1B20 #F3E4E7 #D2C3C7 #A09195 #817377 #5E5054 #E11D48', '#FFFFFF', ''),
  'deepsea': pal('Deep Sea', 'k', '#03111A #051824 #082030 #132B3A #193141 #263E4D #172F3E #193141 #DDF3FF #BDD3E0 #8CA3B0 #6E8593 #4C6472 #2DD4BF', '#02201C', ''),
  'forest': pal('Forest', 'k', '#0E1511 #121B16 #17231C #212D26 #28332C #344039 #25312A #28332C #E6F0EA #C7D1CB #97A29C #7A857F #59655E #34D399', '#062016', ''),
  'espresso': pal('Espresso', 'k', '#18130F #1E1814 #251E19 #2F2823 #352E29 #423B36 #332C27 #352E29 #F3ECE6 #D4CDC7 #A59E98 #88817B #67605B #F59E0B', '#241503', ''),
  'sunset': pal('Sunset', 'k', '#1A0F1A #1F1221 #26162A #312133 #372739 #443443 #352537 #372739 #FFE9E0 #DEC9C5 #AD999B #8E7B81 #6B5A64 #FF8A4C', '#2A0E00', ''),
  'cat-mocha': pal('Catppuccin Mocha', 'c', '#181825 #1B1B29 #1E1E2E #272738 #2C2D3E #36384A #2A2B3C #2C2D3E #CDD6F4 #B3BAD6 #8A90A9 #72768D #56596D #CBA6F7', '#1E1E2E', ''),
  'cat-frappe': pal('Catppuccin Frappé', 'c', '#292C3C #2C3040 #303446 #383C4F #3C4054 #454A5E #3A3F52 #3C4054 #C6D0F5 #B0B9DB #9FA7C8 #787F9A #60667E #8CAAEE', '#232634', ''),
  'dracula': pal('Dracula', 'c', '#21222C #242630 #282A36 #32343F #393A45 #454750 #373843 #393A45 #F8F8F2 #D9D9D6 #A9AAAB #8C8D90 #6B6C72 #BD93F9', '#21222C', ''),
  'tokyo': pal('Tokyo Night', 'c', '#16161E #181822 #1A1B26 #222430 #272937 #313443 #262734 #272937 #C0CAF5 #A7B0D6 #848BAA #6A6F89 #4F5368 #7AA2F7', '#16161E', ''),
  'nord': pal('Nord', 'c', '#2E3440 #343A48 #3B4252 #444B5A #49505F #545A69 #474E5D #49505F #ECEFF4 #D1D5DC #B3B8C0 #9095A0 #747986 #88C0D0', '#2E3440', ''),
  'gruvbox': pal('Gruvbox', 'c', '#1D2021 #222424 #282828 #32312F #383633 #43413B #363532 #383633 #EBDBB2 #CEC09D #A1977E #867E6A #666154 #FABD2F', '#282828', ''),
  'rosepine': pal('Rosé Pine', 'c', '#191724 #1C1A28 #1F1D2E #292738 #2E2C3E #3A384A #2D2B3C #2E2C3E #E0DEF4 #C3C1D6 #9795A9 #7C7A8D #5D5B6D #EBBCBA', '#191724', ''),
  'solarized': pal('Solarized', 'c', '#002B36 #03303B #073642 #133F49 #19444E #274F57 #17424C #19444E #EEE8D5 #CBCDBF #96A49D #768B89 #516F71 #2AA198', '#002B36', ''),
  'everforest': pal('Everforest', 'c', '#232A2E #282F34 #2D353B #353C41 #3A4144 #44494B #393F43 #3A4144 #D3C6AA #BAB099 #AEA692 #7D7B70 #62635F #A7C080', '#232A2E', ''),
  'kanagawa': pal('Kanagawa', 'c', '#16161D #1A1A22 #1F1F28 #28282F #2E2E34 #39393C #2C2C32 #2E2E34 #DCD7BA #C0BBA4 #949183 #7A776E #5B5A57 #7E9CD8', '#16161D', ''),
  'onedark': pal('One Dark', 'c', '#21252B #24282F #282C34 #31353D #363A42 #41454D #353940 #363A42 #DCDFE4 #C1C4CA #989BA1 #7E8288 #62656C #61AFEF', '#1B1F27', ''),
  'monokai': pal('Monokai', 'c', '#1E1F1C #22231F #272822 #31322C #383933 #44453F #363731 #383933 #F8F8F2 #D9D9D3 #A9A9A3 #8B8C86 #6A6B65 #A6E22E', '#1E1F1C', ''),
};
const ACCENTS = { indigo: '#4F46E5', blue: '#2563EB', sky: '#0284C7', teal: '#0D9488', green: '#16A34A', amber: '#D97706', orange: '#EA580C', rose: '#E11D48', pink: '#DB2777', violet: '#7C3AED' };
function themePrefs() {
  let t = { theme: 'graphite', accent: 'auto', motion: 'full' };
  try { t = { ...t, ...JSON.parse(localStorage.getItem('knot.theme') || '{}') }; } catch { }
  if (!PALETTES[t.theme]) t.theme = 'graphite';
  if (t.accent !== 'auto' && !ACCENTS[t.accent]) t.accent = 'auto';
  if (!['full', 'calm', 'off'].includes(t.motion)) t.motion = 'full';
  return t;
}
function themeVars() {
  const t = themePrefs();
  const key = t.theme;
  const P = PALETTES[key], dk = 1, own = t.accent === 'auto';
  const mix = (c, pct, base) => `color-mix(in srgb,${c} ${pct}%,${base})`;
  const v = {
    bg: P.bg, side: P.side, card: P.card, surface: P.surface, line: P.line, line2: P.line2, row: P.row, soft: P.soft,
    ink: P.ink, ink2: P.ink2, mute: P.mute, faint: P.faint, ring: P.ring,
    gline: P.line2, gline2: mix(P.line2, 55, P.ring),
    acc: own ? P.acc : ACCENTS[t.accent], 'on-acc': own ? P.onAcc : '#FFFFFF',
    'acc-soft': mix('var(--acc)', dk ? 22 : 12, P.card), 'acc-ink': mix('var(--acc)', dk ? 55 : 82, P.ink),
    warn: dk ? '#FB923C' : '#C2410C', 'warn-soft': mix(dk ? '#FB923C' : '#C2410C', dk ? 18 : 10, P.card),
    ok: dk ? '#86EFAC' : '#166534', 'ok-soft': mix(dk ? '#86EFAC' : '#16A34A', dk ? 16 : 14, P.card),
    hov: dk ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.045)', toast: dk ? mix(P.ink, 22, P.card) : '#18181B',
  };
  // gradient partner for the accent: lighter when text on it is dark, darker when it is white (keeps button text readable)
  v.acc2 = mix('var(--acc)', 72, v['on-acc'] === '#FFFFFF' ? '#000000' : '#FFFFFF');
  return { t, key, P, css: Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(';') + `;color-scheme:${dk ? 'dark' : 'light'}` };
}
function applyTheme() {
  const { t, key, P, css } = themeVars();
  const h = document.documentElement;
  h.style.cssText = css; h.dataset.theme = key; h.dataset.fx = P.fx; h.dataset.motion = t.motion;
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.content = P.bg;
  return t;
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); if (window.renderPomo) renderPomo(); });
</script>
<style>
:root{
  --bg:#FAFAF9; --side:#F4F3F1; --card:#FFFFFF; --line:#EEECEA; --line2:#E7E5E4; --row:#F1F0EE;
  --ink:#18181B; --ink2:#3F3F46; --mute:#52525B; --faint:#71717A; --ring:#A1A1AA;
  --acc:#4F46E5; --acc-soft:#EEF0FF; --acc-ink:#4338CA;
  --warn:#C2410C; --warn-soft:#FFF1E9; --r:16px;
  --surface:#FFFFFF; --soft:#F4F4F5; --gline:#E4E4E7; --gline2:#D4D4D8; --hov:rgba(24,24,27,.05);
  --on-acc:#FFFFFF; --toast:#18181B; --ok:#166534; --ok-soft:#DCFCE7;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mute{color:var(--mute)} .small{font-size:13px} .late{color:var(--warn)!important}

/* shell */
#app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100dvh}
#sidebar{display:none}
#main{min-width:0;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);min-width:60px;padding:6px 0}
.tab.on{color:var(--acc);font-weight:600}
.tab svg{width:24px;height:24px}
@media (min-width:900px){
  #app{grid-template-columns:248px minmax(0,1fr);height:100vh}
  #sidebar{display:flex;flex-direction:column;gap:18px;background:var(--side);border-right:1px solid var(--line2);padding:20px 12px;overflow:auto}
  #tabbar{display:none}
  #main{padding-bottom:0;height:100vh;overflow:auto}
  .m-only{display:none!important}
}
@media (max-width:899px){.d-only{display:none!important}}

/* sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:16px;font-weight:700}
.logo{width:28px;height:28px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;color:var(--on-acc)}
.logo svg{width:16px;height:16px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line2);color:var(--mute)}
.search svg{width:16px;height:16px}
.search input{border:none;outline:none;background:transparent;flex:1;min-width:0;font-size:14px;color:var(--ink)}
kbd{font:inherit;font-size:11px;color:var(--mute)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{height:38px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--ink2)}
.nav a:hover{background:var(--hov)}
.nav a.on{background:var(--surface);color:var(--acc);font-weight:600}
.nav a svg{width:18px;height:18px}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:12px;color:var(--mute);font-weight:500}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px 0 12px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.side-h button{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.side-h button svg{width:16px;height:16px}
.side-foot{margin-top:auto}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.err{background:var(--warn-soft);color:var(--warn)}

/* page */
.page{max-width:820px;margin:0 auto;padding:20px 16px 32px}
@media (min-width:900px){.page{padding:40px 48px}}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.hdr-actions{display:flex;gap:2px;align-items:center}
.title{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.title.sm{font-size:24px}
.subrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.progress{height:6px;border-radius:3px;background:var(--line2);flex:1;min-width:100px;max-width:240px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card.pad{padding:18px}
.sec-h{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 8px 8px;display:flex;justify-content:space-between}
.empty{padding:24px 16px;text-align:center;color:var(--mute);font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute)}
.icon-btn:hover{background:var(--hov)}
.icon-btn svg{width:22px;height:22px}
.btn{height:40px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.sec{background:var(--surface);border:1px solid var(--line2);color:var(--ink)}
.btn.danger{color:var(--warn)}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;flex:none}
.seg button,.seg a{height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;justify-content:center}
.seg .on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(24,24,27,.08)}
.seg.full{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
.seg.full a{height:38px;font-size:14px}
.back{height:44px;display:inline-flex;align-items:center;gap:2px;font-size:15px;font-weight:500;color:var(--acc)}
.back svg{width:20px;height:20px}

/* tasks */
.task{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 2px;border-bottom:1px solid var(--row);min-height:56px}
.task:last-child{border-bottom:none}
.check{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--ring);display:flex;align-items:center;justify-content:center;color:var(--on-acc)}
.ring svg{width:12px;height:12px;display:none}
.ring.p1{border-color:var(--warn)} .ring.p2{border-color:#2563EB} .ring.p3{border-color:#0D9488}
.task.done .ring{background:var(--acc);border-color:var(--acc)}
.task.done .ring svg{display:block}
.tbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px;padding:8px 0}
.ttl{font-size:15.5px;font-weight:500;overflow-wrap:anywhere}
.task.done .ttl{color:var(--faint);text-decoration:line-through}
.meta{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta:empty{display:none}
.task.done .meta{color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.sq{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.chip svg{width:12px;height:12px}
.chip.p1{color:var(--warn);background:var(--warn-soft)}
.chip.note{color:var(--acc-ink);background:var(--acc-soft);font-weight:500}
.qa{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);color:var(--acc);margin:16px 0 4px}
.qa svg{width:20px;height:20px}
.qa input{border:none;outline:none;background:transparent;flex:1;min-width:0;font-size:15px;color:var(--ink)}
.qa:focus-within{border-color:var(--acc)}
.hint{font-size:12px;color:var(--mute);margin:0 6px}
details.done-list summary{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--mute);margin:22px 8px 8px;text-transform:uppercase;letter-spacing:.06em}
details.done-list summary::-webkit-details-marker{display:none}

/* upcoming */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:16px}
.strip button{height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.strip .wd{font-size:11px;font-weight:500;color:var(--mute)}
.strip .dn{font-size:17px;font-weight:600}
.strip .dd{width:4px;height:4px;border-radius:2px;background:transparent}
.strip .has .dd{background:var(--acc)}
.strip .on{background:var(--acc);color:var(--on-acc)}
.strip .on .wd{color:var(--on-acc)} .strip .on .dd{background:var(--on-acc)}
.day-h{margin:20px 8px 8px;font-size:15px;font-weight:600}
.day-h span{font-weight:400;color:var(--mute)}
.free{font-size:13px;color:var(--mute);margin:0 8px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.month .wh{font-size:11px;color:var(--mute);text-align:center;font-weight:500;padding-bottom:4px}
.month button{aspect-ratio:1/1;max-height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500}
.month button.out{color:var(--ring)}
.month button.today{box-shadow:inset 0 0 0 1.5px var(--acc)}
.month button.on{background:var(--acc);color:var(--on-acc)}
.month .dots{display:flex;gap:2px;height:4px}
.month .dots i{width:4px;height:4px;border-radius:2px;background:var(--acc)}
.month button.on .dots i{background:var(--on-acc)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}

/* projects */
.prow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--row);min-height:56px}
.prow:last-child{border-bottom:none}
.prow .pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.prow .ptop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.prow .pname{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px}
.chev{width:16px;height:16px;color:var(--ring)}
.ptitle{display:flex;align-items:center;gap:10px;margin-top:4px}
.ptitle .sq{width:14px;height:14px;border-radius:4px}
.ptitle h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.ncard{display:flex;flex-direction:column;gap:4px;padding:14px 18px;margin-bottom:10px}
.ncard .nt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:16px;font-weight:600}
.ncard .nd{font-size:12px;color:var(--mute);font-weight:400;flex:none}
.ncard .np{font-size:14px;color:var(--mute);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-actions{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap}

/* notes */
.notes-layout{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.notes-layout.has-note .tree-col{display:none}
.tree-col{padding:16px 10px 24px}
.editor-col{min-width:0;padding:12px 16px 32px}
.note-side{padding:0 16px 32px;display:flex;flex-direction:column;gap:22px}
@media (min-width:900px){
  .notes-layout,.notes-layout.has-note{grid-template-columns:260px minmax(0,1fr);min-height:100vh;align-items:start}
  .notes-layout.has-note .tree-col{display:block}
  .tree-col{grid-row:1 / span 2;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);overflow:auto;padding:20px 10px}
  .editor-col{grid-column:2;grid-row:1;padding:24px 48px 24px}
  .note-side{grid-column:2;grid-row:2;padding:0 48px 48px}
}
@media (min-width:1280px){
  .notes-layout.has-note{grid-template-columns:260px minmax(0,1fr) 290px}
  .note-side{grid-column:3;grid-row:1 / span 2;position:sticky;top:0;height:100vh;border-left:1px solid var(--line);padding:24px 20px;overflow:auto}
}
.tree-top{display:flex;align-items:center;gap:6px;padding:0 6px 12px}
.tree-top .search{height:36px;flex:1;min-width:0}
.tree-col{overflow-x:hidden}
.sq-btn{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;flex:none}
.sq-btn svg{width:18px;height:18px}
.sq-btn.ghost{background:var(--surface);border:1px solid var(--line2);color:var(--ink2)}
.tr{width:100%;height:34px;padding:0 8px 0 calc(8px + var(--d,0) * 16px);border-radius:8px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);text-align:left}
.tr:hover,.tr.fr:hover{background:var(--hov)}
.tr.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.tr.top{font-weight:600}
.tr.fr{padding:0 4px 0 0}
.fr-main{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:8px;padding-left:calc(8px + var(--d,0) * 16px);text-align:left;font-weight:500;color:var(--ink2)}
.fdot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--acc);background:transparent}
.fr-acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.tr.fr:hover .fr-acts,.tr.fr:focus-within .fr-acts{opacity:1}
@media (hover:none){.fr-acts{opacity:1}}
.fr-acts button{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.fr-acts button:hover{background:var(--hov);color:var(--ink)}
.fr-acts svg{width:14px;height:14px}
.tr.fr.closed .fold{transform:rotate(-90deg)}
.tr svg{width:14px;height:14px;color:var(--faint)}
.tr .tl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .cnt{font-size:12px;color:var(--mute)}
.tr .fold{transition:transform .15s}
.tr.closed .fold{transform:rotate(-90deg)}
@media (max-width:899px){.tr{height:44px;font-size:15px}}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.crumb{font-size:13px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ed-actions{display:flex;gap:4px;align-items:center}
.ed-actions .icon-btn{width:40px;height:40px}
.ed-actions .icon-btn svg{width:19px;height:19px}
.ed-actions .icon-btn.on{color:var(--acc)}
.ed-title{width:100%;border:none;outline:none;background:transparent;font-size:32px;font-weight:700;letter-spacing:-.02em;padding:4px 0;margin:4px 0 8px}
.props{display:grid;grid-template-columns:110px minmax(0,1fr);row-gap:8px;column-gap:8px;font-size:14px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line);align-items:center}
.props dt{color:var(--mute)}
.props dd{margin:0;min-width:0}
.props select,.props input{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;margin-left:-7px;max-width:100%;font-size:14px}
.props select:hover,.props input:hover,.props select:focus,.props input:focus{border-color:var(--line2);background:var(--surface);outline:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.ed-body{width:100%;min-height:50vh;border:none;outline:none;background:transparent;resize:none;font-size:16px;line-height:1.65;font-family:inherit;padding:0;overflow:hidden}
.linked{margin-top:28px}
.linked .qa{height:44px;margin:8px 0 0}
.md{font-size:16px;line-height:1.65;color:var(--ink2);max-width:720px;overflow-wrap:anywhere}
.md h2{font-size:24px;margin:18px 0 6px} .md h3{font-size:19px;margin:16px 0 6px} .md h4{font-size:16px;margin:14px 0 4px}
.md p{margin:0 0 12px} .md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li.cb{list-style:none;margin-left:-22px;display:flex;gap:10px;align-items:flex-start}
.mdcb{width:20px;height:20px;border-radius:6px;border:2px solid var(--ring);margin-top:3px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-acc)}
.mdcb svg{width:12px;height:12px}
.mdcb.on{background:var(--acc);border-color:var(--acc)}
.struck{color:var(--faint);text-decoration:line-through}
.md blockquote{margin:0 0 12px;padding:4px 14px;border-left:3px solid var(--line2);color:var(--mute)}
.md pre{background:var(--soft);border-radius:10px;padding:12px;overflow:auto;font-size:13px}
.mx{font-family:'Cambria Math','STIX Two Math','Latin Modern Math',Cambria,Georgia,serif;font-size:1.08em;white-space:nowrap;padding:0 2px}
.mxb{display:block;text-align:center;font-size:1.3em;margin:4px 0 14px;white-space:normal}
.mx .mn{color:var(--ok)} .mx .mo{color:var(--acc-ink);padding:0 .18em;font-weight:600} .mx .mb{color:var(--mute)}
.mx .mv{font-style:italic;color:var(--warn)} .mx .mt{color:var(--ink2)}
.mx .mq{display:inline-block;font-family:system-ui,sans-serif;font-size:.85em;color:var(--warn);font-weight:700;min-width:1em;text-align:center;background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:4px;padding:0 .15em}
.md code{background:var(--soft);border-radius:4px;padding:1px 5px;font-size:.9em}
.md pre code{background:none;padding:0}
.md hr{border:none;border-top:1px solid var(--line2);margin:18px 0}
.md a{color:var(--acc-ink);text-decoration:underline}
.md a.wl{text-decoration:none;font-weight:500;background:var(--acc-soft);padding:1px 4px;border-radius:4px}
.md a.wl.missing{background:none;color:var(--faint);border-bottom:1px dashed var(--ring);border-radius:0}
.tbl{overflow-x:auto;margin:0 0 12px}
.md table{border-collapse:collapse;font-size:14px;min-width:300px}
.md th,.md td{text-align:left;padding:7px 20px 7px 0;border-bottom:1px solid var(--soft)}
.md th{border-bottom-color:var(--gline);font-weight:600}
.side-sec{display:flex;flex-direction:column;gap:8px}
.side-h3{margin:0;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.bl{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.bl b{font-size:14px;font-weight:500;display:flex;align-items:baseline;gap:6px;line-height:1.35}
.bl .sq,.lk .sq{flex-shrink:0;transform:translateY(-1px)}
.bl > span{overflow-wrap:anywhere}
.bl span{font-size:12px;color:var(--mute);line-height:1.45}
.lk{min-height:34px;padding:7px 10px;line-height:1.35;border-radius:8px;display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.lk.missing{color:var(--faint);border-style:dashed}

/* graph */
.graph-page{display:flex;flex-direction:column;height:calc(100dvh - 76px - env(safe-area-inset-bottom));padding:12px 12px 0}
@media (min-width:900px){.graph-page{height:100vh;padding:20px 24px}}
.g-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chk{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.chk input{margin:0;width:16px;height:16px;accent-color:var(--acc)}
.g-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;flex:none;scrollbar-width:none}
.g-chips::-webkit-scrollbar{display:none}
.g-chips button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.g-chips button[aria-pressed=false]{opacity:.45;background:transparent}
.g-wrap{position:relative;flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#gsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#gsvg.grabbing{cursor:grabbing}
#gsvg line{stroke:var(--gline);stroke-width:1.3}
#gsvg line.e-link{stroke:var(--gline2);stroke-width:1.6}
#gsvg line.hl{stroke:var(--acc);stroke-opacity:.8;stroke-width:2}
#gsvg .n{cursor:pointer}
#gsvg .n text{font-size:12px;fill:var(--ink2);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none;display:none}
#gsvg .n-hub text{display:block;font-weight:600;fill:var(--ink)}
#gsvg .n-folder text{display:block;font-weight:600;fill:var(--ink2)}
#gsvg .n-folder circle.c{stroke:var(--card);stroke-width:2}
#gsvg .fring{fill:none;stroke-width:1.5;stroke-opacity:.55;stroke-dasharray:3 2.5}
#gsvg.zoomed .n-note text{display:block}
#gsvg.zoomed2 .n-task text{display:block}
#gsvg .n.sel text,#gsvg .n.nb text{display:block}
#gsvg .n.sel text{font-weight:700;fill:var(--ink)}
#gsvg .n.sel .halo{display:block}
#gsvg .halo{display:none;fill:none;stroke:var(--acc);stroke-width:2.5}
#gsvg .dim{opacity:.22}
#gsvg .n-task circle.c{stroke:var(--surface);stroke-width:1.5}
.g-legend{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--mute);background:color-mix(in srgb,var(--surface) 92%,transparent);padding:6px 10px;border-radius:8px;display:flex;gap:12px;flex-wrap:wrap;pointer-events:none}
.g-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.g-zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:18px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.g-zoom svg{width:16px;height:16px}
#gpanel{position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:0 8px 24px rgba(24,24,27,.12);padding:16px;display:flex;flex-direction:column;gap:10px;max-height:55%;overflow:auto}
#gpanel:empty{display:none}
@media (min-width:900px){#gpanel{left:auto;right:12px;top:12px;bottom:auto;width:300px;max-height:calc(100% - 24px)}}
#gpanel h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
#gpanel .x{position:absolute;right:8px;top:8px;width:36px;height:36px}
#gpanel p{margin:0;font-size:14px;line-height:1.5;color:var(--ink2)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.tile{padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .tl{font-size:12px;color:var(--mute);font-weight:500}
.tile .tv{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tile .tv small{font-size:14px;font-weight:500;color:var(--mute)}
.tile .ts{font-size:12px;color:var(--mute)}
.chart-card{margin-top:12px;padding:16px 16px 12px}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.chart-h h2{margin:0;font-size:15px;font-weight:600}
.chart{position:relative;height:160px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--gline2)}
.bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;position:relative}
.bar-col i{display:block;width:min(22px,70%);border-radius:4px 4px 0 0;background:var(--acc);min-height:0}
.bar-col i.today{background:color-mix(in srgb,var(--acc) 60%,var(--surface))}
.bar-col .bv{font-size:12px;font-weight:600;visibility:hidden}
.bar-col .bv.show,.bar-col:hover .bv{visibility:visible}
.bar-col:hover i{filter:brightness(.9)}
.goal{position:absolute;left:0;right:0;border-top:1px dashed var(--ring);pointer-events:none}
.goal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--mute);background:var(--surface);padding:0 4px}
.xl{display:flex;gap:2px;margin-top:6px}
.xl span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--mute);font-weight:500}
.xl span.t{font-weight:700;color:var(--ink)}
.hb{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 28px;align-items:center;gap:10px;margin-top:10px}
.hb .hn{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.hb .ht{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.hb .ht i{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}
.hb .hv{font-size:13px;font-weight:600;text-align:right}

/* forms, dialog, toast */
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--mute);flex:1;min-width:0}
.fld input,.fld select,.fld textarea{height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;font-size:15px;color:var(--ink);background:var(--surface);width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--acc)}
.fld-row{display:flex;gap:10px}
.set-sec{margin-top:14px}
.set-sec h2{margin:0 0 6px;font-size:16px;font-weight:600}
.set-sec p{margin:0 0 12px;font-size:14px;color:var(--mute);line-height:1.5}
.set-sec form{display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
dialog{border:none;border-radius:20px;padding:0;width:min(480px,calc(100vw - 24px));box-shadow:0 20px 50px rgba(24,24,27,.25);color:var(--ink)}
dialog::backdrop{background:rgba(24,24,27,.35)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg-form h2{margin:0 0 4px;font-size:18px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swatches label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--toast);color:#fff;border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast:empty{display:none}
#toast button{color:#A5B4FC;font-weight:600;padding:6px 8px}
@media (min-width:900px){#toast{bottom:24px}}
/* style: lit buttons and glow, all palettes (static, cheap: shadows only) */
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));position:relative;overflow:hidden;isolation:isolate;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 70%,transparent),0 6px 18px -6px color-mix(in srgb,var(--acc) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.pri::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-130%)}
.btn.pri:hover{box-shadow:0 0 0 1px var(--acc),0 0 22px -2px color-mix(in srgb,var(--acc) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.pri:hover::after{transform:translateX(130%);transition:transform .55s ease}
.btn.sec:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line2));box-shadow:0 0 14px -4px color-mix(in srgb,var(--acc) 60%,transparent);color:var(--acc-ink)}
.logo{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 16px -2px color-mix(in srgb,var(--acc) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.nav a.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc),0 0 20px -8px var(--acc)}
.nav a.on svg,.tab.on svg{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--acc) 80%,transparent))}
.title,.ptitle h1{background:linear-gradient(90deg,var(--ink) 30%,var(--acc-ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px -18px rgba(0,0,0,.8)}
.qa:focus-within,.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent),0 0 20px -6px var(--acc)}
.check:hover .ring{border-color:var(--acc);box-shadow:0 0 10px -1px color-mix(in srgb,var(--acc) 70%,transparent)}
.task.done .ring{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 10px -1px color-mix(in srgb,var(--acc) 70%,transparent)}
.th.on{box-shadow:0 0 0 1px var(--acc),0 0 18px -4px var(--acc)}
.tbtn:hover{border-color:currentColor;box-shadow:0 0 16px -4px currentColor}

  tasks: ['id', 'project_id', 'title', 'due', 'due_time', 'priority', 'done', 'done_at', 'section', 'note_id', 'recur', 'created_at', 'updated_at', 'deleted'],
  folders: ['id', 'name', 'parent_id', 'project_id', 'color', 'position', 'created_at', 'updated_at', 'deleted'],
  cards: ['id', 'note_id', 'due', 'ivl', 'ease', 'reps', 'lapses', 'created_at', 'updated_at', 'deleted'],
  notes: ['id', 'project_id', 'folder', 'folder_id', 'title', 'body', 'pinned', 'created_at', 'updated_at', 'deleted'],
};
const store = {
  db: load('knot.db', { projects: {}, folders: {}, tasks: {}, notes: {}, cards: {} }),
  dirty: new Set(load('knot.dirty', [])),
  meta: load('knot.meta', { lastPull: {}, goal: 5 }),
};
TABLES.forEach(t => { store.db[t] = store.db[t] || {}; });
store.meta.lastPull = store.meta.lastPull || {};
function persist() { save('knot.db', store.db); save('knot.dirty', [...store.dirty]); save('knot.meta', store.meta); }
const all = t => Object.values(store.db[t]).filter(r => !r.deleted);
const get = (t, id) => { const r = id && store.db[t][id]; return r && !r.deleted ? r : null; };
function put(t, row, doRender = true) {
  row.updated_at = nowISO();
  row.created_at = row.created_at || row.updated_at;
  store.db[t][row.id] = row;
  store.dirty.add(t + ':' + row.id);
  persist();
  sync.schedulePush();
  if (doRender) render(true);
  return row;
}
const create = (t, f, r = true) => put(t, { id: uid(), deleted: false, ...f }, r);
const update = (t, id, patch, r = true) => { const o = store.db[t][id]; if (o) return put(t, { ...o, ...patch }, r); };
const removeRow = (t, id) => update(t, id, { deleted: true });

/* ---- folders: a folder sits inside another folder, a project, or at the top level ---- */
const fParent = f => get('folders', f.parent_id);
const fProject = f => { for (let x = f, i = 0; x && i < 50; x = fParent(x), i++) { if (!fParent(x)) return get('projects', x.project_id); } return null; };
const fPath = f => { const out = []; for (let x = f, i = 0; x && i < 50; x = fParent(x), i++) out.unshift(x.name || 'Untitled'); return out.join(' / '); };
const fColor = f => { for (let x = f, i = 0; x && i < 50; x = fParent(x), i++) if (x.color) return x.color; return fProject(f)?.color || null; };
const fDesc = id => { const out = new Set([id]); let grew = true; while (grew) { grew = false; all('folders').forEach(f => { if (f.parent_id && out.has(f.parent_id) && !out.has(f.id)) { out.add(f.id); grew = true; } }); } return out; };
const sortedFolders = () => all('folders').sort((a, b) => (a.position ?? 0) - (b.position ?? 0) || (a.name || '').localeCompare(b.name || ''));
const noteFolder = n => get('folders', n.folder_id);
const noteProject = n => { const f = noteFolder(n); return f ? fProject(f) : get('projects', n.project_id); };
const noteColor = n => { const f = noteFolder(n); return (f && fColor(f)) || noteProject(n)?.color || '#A1A1AA'; };
const notePlace = n => { const f = noteFolder(n), p = noteProject(n); return [p ? p.name : '', f ? fPath(f) : ''].filter(Boolean).join(' / ') || 'Inbox'; };
const sortedProjects = () => all('projects').sort((a, b) => (a.position ?? 0) - (b.position ?? 0) || a.name.localeCompare(b.name));
function groups() {
  const gs = [...new Set(sortedProjects().map(p => p.grp || 'Other'))];
  return gs.sort((a, b) => { const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });
}
const sortTasks = ts => ts.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.priority || 4) - (b.priority || 4) || (a.due_time || '99').localeCompare(b.due_time || '99') || (a.created_at || '').localeCompare(b.created_at || ''));
const openTasks = () => all('tasks').filter(x => !x.done);
function titleMap() { const m = new Map(); all('notes').forEach(n => { const k = (n.title || '').trim().toLowerCase(); if (k && !m.has(k)) m.set(k, n); }); return m; }
const noteByTitle = t => titleMap().get(String(t).trim().toLowerCase()) || null;
const linksOf = body => [...new Set([...String(body || '').matchAll(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g)].map(m => m[1].trim()))];
const tagsOf = body => [...new Set([...String(body || '').matchAll(/(^|\s)#([\p{L}\p{N}_-]+)/gu)].map(m => m[2]))];
const plain = body => String(body || '').replace(/```[\s\S]*?```/g, '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => b || a).replace(/[#*>`|\-\[\]]/g, ' ').replace(/\s+/g, ' ').trim();

/* ============ sync (Supabase) ============ */
const sync = {
  client: null, user: null, status: 'local', timer: null, channel: null, lastError: '',
  cfg() { return { url: localStorage.getItem('knot.sbUrl') || SUPABASE_URL, key: localStorage.getItem('knot.sbKey') || SUPABASE_KEY }; },
  configured() { const c = this.cfg(); return !!(c.url && c.key); },
  async init() {
    const { url, key } = this.cfg();
    if (!url || !key) return this.setStatus('local');
    if (!window.supabase) { this.lastError = 'Sync library did not load (offline?)'; return this.setStatus('offline'); }
    try {
      this.client = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'knot.auth' } });
      const { data } = await this.client.auth.getSession();
      this.user = data.session?.user ?? null;
      this.client.auth.onAuthStateChange((_e, session) => {
        const was = this.user?.id;
        this.user = session?.user ?? null;
        if (this.user && this.user.id !== was) setTimeout(() => this.start(), 0); // never call Supabase inside this callback
        if (!this.user && was) this.stop();
        render();
      });
      if (this.user) this.start(); else this.setStatus('signed-out');
    } catch (e) { this.fail(e); }
  },
  async start() { await this.pull(); await this.push(); this.subscribe(); },
  stop() { if (this.channel) { this.client.removeChannel(this.channel); this.channel = null; } this.setStatus('signed-out'); },
  fail(e) { console.error(e); this.lastError = e?.message || String(e); this.setStatus('error'); },
  setStatus(s) { this.status = s; document.querySelectorAll('[data-sync]').forEach(el => { el.textContent = syncLabel(); el.className = 'pill ' + syncClass(); }); },
  schedulePush() { if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 700); },
  toRemote(t, r) {
    const o = { user_id: this.user.id };
    COLS[t].forEach(c => { o[c] = r[c] ?? null; });
    o.deleted = !!r.deleted;
    if (t === 'tasks') { o.due = r.due || null; o.priority = r.priority || 4; o.done = !!r.done; }
    if (t === 'notes') o.pinned = !!r.pinned;
    return o;
  },
  fromRemote(t, r) {
    const o = {};
    COLS[t].forEach(c => { o[c] = r[c]; });
    if (t === 'tasks') { o.due = r.due || ''; o.due_time = r.due_time || ''; o.section = r.section || ''; o.recur = r.recur || ''; }
    if (t === 'notes') { o.folder = r.folder || ''; o.body = r.body || ''; o.title = r.title || ''; }
    return o;
  },
  merge(t, r) {
    const loc = store.db[t][r.id];
    const rr = this.fromRemote(t, r);
    if (!loc || new Date(rr.updated_at) > new Date(loc.updated_at)) {
      store.db[t][r.id] = rr;
      store.dirty.delete(t + ':' + r.id);
      return true;
    }
    return false;
  },
  async push() {
    if (!this.user) return;
    if (!store.dirty.size) return this.setStatus('synced');
    if (!navigator.onLine) return this.setStatus('offline');
    this.setStatus('syncing');
    const batch = [...store.dirty];
    const rowOf = k => { const i = k.indexOf(':'); return store.db[k.slice(0, i)]?.[k.slice(i + 1)]; };
    const snap = new Map(batch.map(k => [k, rowOf(k)?.updated_at]));
    try {
      for (const t of TABLES) {
        const rows = batch.filter(k => k.startsWith(t + ':')).map(rowOf).filter(Boolean).map(r => this.toRemote(t, r));
        for (let i = 0; i < rows.length; i += 500) {
          const { error } = await this.client.from(t).upsert(rows.slice(i, i + 500));
          if (error) throw error;
        }
      }
      for (const [k, u] of snap) if (!rowOf(k) || rowOf(k).updated_at === u) store.dirty.delete(k);
      persist();
      if (store.dirty.size) this.schedulePush(); else this.setStatus('synced');
    } catch (e) { this.fail(e); }
  },
  async pull() {
    if (!this.user) return;
    if (!navigator.onLine) return this.setStatus('offline');
    this.setStatus('syncing');
    const uidKey = this.user.id;
    let since = store.meta.lastPull[uidKey] || null, maxSeen = since, changed = false;
    try {
      for (const t of TABLES) {
        let from = since;
        for (;;) {
          let q = this.client.from(t).select('*').order('synced_at', { ascending: true }).limit(1000);
          if (from) q = q.gt('synced_at', from);
          const { data, error } = await q;
          if (error) throw error;
          for (const r of data) {
            if (this.merge(t, r)) changed = true;
            if (!maxSeen || new Date(r.synced_at) > new Date(maxSeen)) maxSeen = r.synced_at;
          }
          if (data.length < 1000) break;
          from = data[data.length - 1].synced_at;
        }
      }
      store.meta.lastPull[uidKey] = maxSeen;
      persist();
      if (changed) render();
      this.setStatus(store.dirty.size ? 'syncing' : 'synced');
    } catch (e) { this.fail(e); }
  },
  subscribe() {
    if (this.channel || !this.user) return;
    const ch = this.client.channel('knot-' + this.user.id);
    TABLES.forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t, filter: `user_id=eq.${this.user.id}` }, p => {
      if (p.new && p.new.id && this.merge(t, p.new)) { persist(); render(); }
    }));
    ch.subscribe();
    this.channel = ch;
  },
};
function syncLabel() {
  return { local: 'Local only', 'signed-out': 'Signed out', syncing: 'Syncing…', synced: 'Synced', offline: 'Offline', error: 'Sync error' }[sync.status] || sync.status;
}
function syncClass() { return sync.status === 'synced' ? 'ok' : sync.status === 'error' ? 'err' : ''; }

/* ============ state + routing ============ */
const S = {
  upMode: 'week', upSel: null, upMonth: 0, statsRange: 'week', nfilter: '', q: '',
  closed: new Set(load('knot.closed', [])), nmode: null, nmodeFor: null, focusTitle: null,
  g: { mode: 'all', sel: null, tasks: false, hidden: new Set(), pos: new Map(), view: null, lastRoute: null },
};
function route() {
  const [v = 'today', a = '', b = ''] = decodeURIComponent(location.hash.slice(1)).split('/');
  return { v: v || 'today', a, b };
}
window.addEventListener('hashchange', () => withTransition(() => { enterAnim(); render(true); $('#main').scrollTop = 0; window.scrollTo(0, 0); }));

/* ============ quick-add parser ============ */
function findProject(name) {
  const n = norm(name); if (!n) return null;
  const ps = sortedProjects();
  return ps.find(p => norm(p.name) === n) || ps.find(p => norm(p.name).startsWith(n)) || ps.find(p => p.name.toLowerCase().split(/\s+/).some(w => norm(w).startsWith(n))) || ps.find(p => norm(p.name).includes(n)) || null;
}
function nextWeekday(target) { const cur = new Date().getDay(); let diff = (target - cur + 7) % 7; if (diff === 0) diff = 7; return addDays(today(), diff); }
function parseQuick(text, d = {}) {
  let s = ' ' + text + ' ';
  let priority = 4, project_id = d.project_id || null, due_time = '', due = d.due || '', recur = '';
  s = s.replace(/\s[pP]([1-4])(?=\s)/, (_, p) => { priority = +p; return ' '; });
  s = s.replace(/\s#(\S+)/, (m, name) => { const p = findProject(name); if (p) { project_id = p.id; return ' '; } return m; });
  s = s.replace(/\s(?:at\s)?(\d{1,2}):(\d{2})(?=\s)/i, (_, h, m) => { due_time = pad(+h) + ':' + m; return ' '; });
  s = s.replace(/\s(every\s+day|daily)(?=\s)/i, () => { recur = 'daily'; if (!due) due = today(); return ' '; });
  s = s.replace(/\s(every\s+weekday|weekdays)(?=\s)/i, () => { recur = 'weekdays'; if (!due) due = today(); return ' '; });
  s = s.replace(/\s(every\s+week|weekly)(?=\s)/i, () => { recur = 'weekly'; if (!due) due = today(); return ' '; });
  s = s.replace(/\s(every\s+month|monthly)(?=\s)/i, () => { recur = 'monthly'; if (!due) due = today(); return ' '; });
  s = s.replace(/\severy\s+(mon|tue|wed|thu|fri|sat|sun)[a-z]*(?=\s)/i, (_, w) => { recur = 'weekly'; due = nextWeekday(WD.map(x => x.toLowerCase()).indexOf(w.toLowerCase())); return ' '; });
  s = s.replace(/\s(today|tod)(?=\s)/i, () => { due = today(); return ' '; });
  s = s.replace(/\s(tomorrow|tmr|tom)(?=\s)/i, () => { due = addDays(today(), 1); return ' '; });
  s = s.replace(/\s(next\s+week)(?=\s)/i, () => { due = nextWeekday(1); return ' '; });
  s = s.replace(/\s(mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)(?=\s)/i, (_, w) => { due = nextWeekday(WD.map(x => x.toLowerCase()).indexOf(w.slice(0, 3).toLowerCase())); return ' '; });
  const monthIdx = m => MON.map(x => x.toLowerCase()).indexOf(m.slice(0, 3).toLowerCase());
  const setDM = (dd, mm) => { const t = parseKey(today()); let y = t.getFullYear(); let k = dkey(new Date(y, mm, dd)); if (k < today()) k = dkey(new Date(y + 1, mm, dd)); due = k; };
  s = s.replace(/\s(\d{1,2})\.?\s?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?=\s)/i, (_, dd, m) => { setDM(+dd, monthIdx(m)); return ' '; });
  s = s.replace(/\s(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s(\d{1,2})(?=\s)/i, (_, m, dd) => { setDM(+dd, monthIdx(m)); return ' '; });
  s = s.replace(/\s(\d{1,2})\.(\d{1,2})\.?(?=\s)/, (_, dd, mm) => { setDM(+dd, +mm - 1); return ' '; });
  return { title: s.trim().replace(/\s+/g, ' '), priority, project_id, due_time, due, recur };
}
function nextDue(k, recur) {
  const d = parseKey(k);
  if (recur === 'daily') d.setDate(d.getDate() + 1);
  else if (recur === 'weekly') d.setDate(d.getDate() + 7);
  else if (recur === 'monthly') d.setMonth(d.getMonth() + 1);
  else if (recur === 'weekdays') { do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); }
  return dkey(d);
}

/* ============ small renderers ============ */
function dueLabel(k) {
  const t = today();
  if (k < t) { const days = Math.round((parseKey(t) - parseKey(k)) / 864e5); return { text: days < 7 ? WD[parseKey(k).getDay()] : fmtShort(k), late: true }; }
  if (k === t) return { text: 'Today' };
  if (k === addDays(t, 1)) return { text: 'Tomorrow' };
  if (k <= addDays(t, 6)) return { text: WDL[parseKey(k).getDay()] };
  return { text: fmtShort(k) };
}
function taskRow(x, o = {}) {
  const p = get('projects', x.project_id);
  const n = get('notes', x.note_id);
  const parts = [];
  if (p && !o.hideProject) parts.push(`<span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}`);
  if (x.due && !o.hideDue) { const d = dueLabel(x.due); parts.push(`<span class="${d.late && !x.done ? 'late' : ''}">${d.text}</span>`); }
  if (x.due_time) parts.push(esc(x.due_time));
  if (x.recur) parts.push(`<span title="Repeats ${esc(x.recur)}" style="display:inline-flex;width:14px;height:14px">${I.repeat}</span>`);
  return `<div class="task${x.done ? ' done' : ''}${S.pop === x.id ? ' pop' : ''}"${S.vtTasks ? ` style="view-transition-name:t-${x.id}"` : ''}>
<button class="check" data-act="toggle" data-id="${x.id}" aria-label="${x.done ? 'Mark not done' : 'Complete task'}"><span class="ring p${x.done ? 4 : (x.priority || 4)}">${I.tick}</span></button>
<button class="tbody" data-act="edit-task" data-id="${x.id}"><span class="ttl">${esc(x.title)}</span><span class="meta">${parts.join('<span aria-hidden="true">·</span>')}</span></button>
${x.priority == 1 && !x.done ? '<span class="chip p1">P1</span>' : ''}
${n && !o.hideNote ? `<a class="chip note" href="#note/${n.id}">${I.doc}${esc(n.title || 'Untitled')}</a>` : ''}
</div>`;
}
const taskCard = (ts, o) => ts.length ? `<div class="card">${ts.map(x => taskRow(x, o)).join('')}</div>` : '';
function quickAdd(d = {}) {
  return `<form class="qa" data-form="quick" data-due="${d.due || ''}" data-project="${d.project || ''}" data-note="${d.note || ''}" data-section="${esc(d.section || '')}">
${I.plus}<input id="qa" name="q" autocomplete="off" enterkeyhint="done" placeholder="${esc(d.ph || 'Add a task — e.g. “PDP homework fri p1 #PDP”')}" aria-label="Add a task"></form>`;
}

/* ============ views ============ */
function viewToday() {
  const t = today(), ts = all('tasks');
  const overdue = sortTasks(ts.filter(x => !x.done && x.due && x.due < t));
  const open = sortTasks(ts.filter(x => !x.done && x.due === t));
  const done = ts.filter(x => x.done && doneDay(x) === t && (!x.due || x.due <= t));
  const total = overdue.length + open.length + done.length;
  const pct = total ? Math.round(done.length / total * 100) : 0;
  return `<div class="page">
<div class="hdr"><h1 class="title">Today</h1><div class="hdr-actions m-only"><span class="pill ${syncClass()}" data-sync>${syncLabel()}</span><a class="icon-btn" href="#search" aria-label="Search">${I.search}</a><a class="icon-btn" href="#settings" aria-label="Settings">${I.settings}</a></div></div>
<div class="subrow"><span class="mute">${fmtLong(t)}</span>${total ? `<div class="progress"><i style="width:${pct}%"></i></div><span class="small mute" style="font-weight:500">${done.length} of ${total} done</span>` : ''}</div>
${quickAdd({ due: t })}
${overdue.length ? `<h2 class="sec-h late">Overdue</h2>${taskCard(overdue)}` : ''}
<h2 class="sec-h">Today</h2>
${open.length || done.length ? taskCard(open.concat(done), { hideDue: true }) : '<div class="card empty">Nothing due today. Add a task above.</div>'}
</div>`;
}

function viewUpcoming() {
  const t = today();
  const ts = openTasks().filter(x => x.due);
  const byDay = new Map();
  ts.forEach(x => { if (!byDay.has(x.due)) byDay.set(x.due, []); byDay.get(x.due).push(x); });
  const sel = S.upSel || t;
  const head = `<div class="hdr"><h1 class="title">Upcoming</h1><div class="seg"><button class="${S.upMode === 'week' ? 'on' : ''}" data-act="up-mode" data-v="week">Week</button><button class="${S.upMode === 'month' ? 'on' : ''}" data-act="up-mode" data-v="month">Month</button></div></div>`;
  const dayLabel = k => k === t ? 'Today' : k === addDays(t, 1) ? 'Tomorrow' : WDL[parseKey(k).getDay()];
  if (S.upMode === 'week') {
    const days = [...Array(7)].map((_, i) => addDays(t, i));
    const strip = `<div class="strip">${days.map(k => { const d = parseKey(k); return `<button class="${k === sel ? 'on' : ''} ${byDay.has(k) ? 'has' : ''}" data-act="up-day" data-k="${k}" aria-label="${fmtLong(k)}"><span class="wd">${WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="dd"></span></button>`; }).join('')}</div>`;
    const later = sortTasks(ts.filter(x => x.due > days[6]));
    const list = days.map(k => `<h2 class="day-h" id="d-${k}">${dayLabel(k)} <span>· ${fmtShort(k)}</span></h2>${byDay.has(k) ? taskCard(sortTasks(byDay.get(k)), { hideDue: true }) : '<p class="free">Nothing planned</p>'}`).join('');
    return `<div class="page">${head}<p class="mute" style="margin:4px 0 0">${['January','February','March','April','May','June','July','August','September','October','November','December'][parseKey(t).getMonth()]} ${parseKey(t).getFullYear()}</p>${strip}
${quickAdd({ due: sel, ph: `Add a task for ${dayLabel(sel).toLowerCase() === 'today' ? 'today' : fmtShort(sel)}` })}
${list}${later.length ? `<h2 class="day-h">Later</h2>${taskCard(later)}` : ''}</div>`;
  }
  const base = parseKey(t); const m = new Date(base.getFullYear(), base.getMonth() + S.upMonth, 1);
  const start = new Date(m); start.setDate(1 - ((m.getDay() + 6) % 7));
  const cells = [...Array(42)].map((_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; });
  const grid = `<div class="month">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => `<span class="wh">${w}</span>`).join('')}${cells.map(d => { const k = dkey(d); const n = (byDay.get(k) || []).length; return `<button class="${d.getMonth() !== m.getMonth() ? 'out' : ''} ${k === t ? 'today' : ''} ${k === sel ? 'on' : ''}" data-act="up-day" data-k="${k}" aria-label="${fmtLong(k)}${n ? `, ${n} tasks` : ''}">${d.getDate()}<span class="dots">${'<i></i>'.repeat(Math.min(n, 3))}</span></button>`; }).join('')}</div>`;
  const selTasks = sortTasks(all('tasks').filter(x => x.due === sel));
  return `<div class="page">${head}
<div class="mnav"><button class="icon-btn" data-act="up-month" data-v="-1" aria-label="Previous month">${I.back}</button><strong>${['January','February','March','April','May','June','July','August','September','October','November','December'][m.getMonth()]} ${m.getFullYear()}</strong><button class="icon-btn" data-act="up-month" data-v="1" aria-label="Next month">${I.right}</button></div>
${grid}
<h2 class="day-h">${dayLabel(sel)} <span>· ${fmtShort(sel)}</span></h2>
${quickAdd({ due: sel, ph: `Add a task for ${fmtShort(sel)}` })}
${selTasks.length ? taskCard(selTasks, { hideDue: true }) : '<p class="free" style="margin-top:12px">Nothing planned</p>'}</div>`;
}

function viewProjects() {

function noteTree(cur) {
  const f = S.nfilter.trim().toLowerCase();
  const out = [];
  const isClosed = k => S.closed.has(k);
  const noteRow = (n, d, extra = '') => out.push(`<a class="tr${cur && cur.id === n.id ? ' on' : ''}" style="--d:${d}" href="#note/${n.id}">${n.pinned ? I.pin : I.doc}<span class="tl">${esc(n.title || 'Untitled')}</span>${extra}</a>`);
  const head = (name, d, key, color, count) => out.push(`<button class="tr top${isClosed(key) ? ' closed' : ''}" style="--d:${d}" data-act="fold" data-key="${esc(key)}" aria-expanded="${!isClosed(key)}"><span class="fold">${I.down}</span>${color ? `<span class="sq" style="width:8px;height:8px;background:${esc(color)}"></span>` : ''}<span class="tl">${esc(name)}</span>${count != null ? `<span class="cnt">${count}</span>` : ''}</button>`);
  if (f) {
    // filtering: a flat list of matching notes with where they live
    const hits = all('notes').filter(n => ((n.title || '') + ' ' + (n.body || '') + ' ' + notePlace(n)).toLowerCase().includes(f));
    hits.sort((a, b) => (a.title || '').localeCompare(b.title || '')).forEach(n => noteRow(n, 0, `<span class="cnt">${esc(notePlace(n))}</span>`));
  } else {
    const notes = all('notes'), folders = sortedFolders();
    const sortN = ns => ns.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (a.title || '').localeCompare(b.title || ''));
    const countIn = fid => { const ids = fDesc(fid); return notes.filter(n => ids.has(n.folder_id)).length; };
    const folderRow = (fo, d) => {
      const k = 'f:' + fo.id, c = fColor(fo);
      out.push(`<div class="tr fr${isClosed(k) ? ' closed' : ''}" style="--d:${d}"><button class="fr-main" data-act="fold" data-key="${k}" aria-expanded="${!isClosed(k)}"><span class="fold">${I.down}</span><span class="fdot" style="${c ? `background:${esc(c)};border-color:${esc(c)}` : ''}"></span><span class="tl">${esc(fo.name || 'Untitled')}</span><span class="cnt">${countIn(fo.id) || ''}</span></button><span class="fr-acts"><button data-act="new-note" data-folder="${fo.id}" aria-label="New note in ${esc(fo.name)}" title="New note here">${I.plus}</button><button data-act="edit-folder" data-id="${fo.id}" aria-label="Folder options" title="Rename, move, colour">${I.more}</button></span></div>`);
      if (!isClosed(k)) walk(fo.id, null, d + 1);
    };
    // children of a folder (fid) or of a top-level place (project id, or null = no project)
    function walk(fid, pid, d) {
      const subs = fid ? folders.filter(x => x.parent_id === fid) : folders.filter(x => !fParent(x) && (pid ? x.project_id === pid : !get('projects', x.project_id)));
      subs.forEach(x => folderRow(x, d));
      const ns = fid ? notes.filter(n => n.folder_id === fid) : notes.filter(n => !noteFolder(n) && (pid ? n.project_id === pid : !get('projects', n.project_id)));
      sortN(ns).forEach(n => noteRow(n, d));
    }
    const ps = sortedProjects();
    groups().forEach(g => {
      const gk = 'g:' + g; head(g, 0, gk, null, null);
      if (isClosed(gk)) return;
      ps.filter(p => (p.grp || 'Other') === g).forEach(p => { const k = 'p:' + p.id; head(p.name, 1, k, p.color, notes.filter(n => noteProject(n)?.id === p.id).length); if (!isClosed(k)) walk(null, p.id, 2); });
    });
    if (ps.length) { head('Inbox', 0, 'inbox', null, null); if (!isClosed('inbox')) walk(null, null, 1); }

<label class="search d-only"><span style="display:flex">${I.search}</span><input id="nfilter" data-input="nfilter" value="${esc(S.nfilter)}" placeholder="Filter notes" aria-label="Filter notes"></label>
<button class="sq-btn ghost" data-act="new-folder" data-parent="${here?.id || ''}" aria-label="New folder" title="New folder">${I.folderPlus}</button>
<button class="sq-btn" data-act="new-note" data-project="${cur && !here ? cur.project_id || '' : ''}" data-folder="${here?.id || ''}" aria-label="New note" title="New note">${I.plus}</button></div>
<label class="search m-only" style="margin:0 6px 10px"><span style="display:flex">${I.search}</span><input id="nfilter-m" data-input="nfilter" value="${esc(S.nfilter)}" placeholder="Filter notes" aria-label="Filter notes"></label>
<div role="tree" aria-label="Notes">${out.join('') || `<p class="empty">${f ? 'No notes match.' : 'No notes yet. Make a folder or a note with the buttons above.'}</p>`}</div>`;
}

/* ---- markdown ---- */
function mathHtml(src) {
  const t = src.replace(/<=/g, '≤').replace(/>=/g, '≥').replace(/!=/g, '≠').replace(/\*/g, '×').replace(/(^|[\s(])-(?=[\s\d(a-zA-Z])/g, '$1−').replace(/(\d)-(\d)/g, '$1−$2');
  return t.replace(/(\d+(?:[.,]\d+)*)|([+−×·÷=<>≤≥≠≈:/^%→])|([?▢□])|([()\[\]{}])|([a-zA-Z]+)/g, (m, n, o, q, b, v) =>
    n ? `<span class="mn">${n}</span>` : o ? `<span class="mo">${esc(o)}</span>` : q ? '<span class="mq">▢</span>' : b ? `<span class="mb">${b}</span>` : v.length === 1 ? `<span class="mv">${v}</span>` : `<span class="mt">${v}</span>`);
}
function inline(s) {
  const maths = [];
  s = String(s).replace(/\$([^\s$](?:[^$\n]*[^\s$])?)\$(?!\d)/g, (_, m) => { maths.push(m); return `\u0001${maths.length - 1}\u0001`; });
  let h = esc(s);
  const codes = [];
  h = h.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  h = h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, t, a) => { const target = t.trim(); const ex = noteByTitle(unesc(target)); return `<a class="wl${ex ? '' : ' missing'}" href="#" data-act="wiki" data-title="${target}">${a ? a.trim() : target}</a>`; });
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  h = h.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu, '$1<span class="tag">#$2</span>');
  h = h.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  h = h.replace(/\u0001(\d+)\u0001/g, (_, i) => `<span class="mx">${mathHtml(maths[i])}</span>`);
  return h;
}
function mdTable(rows) {
  const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const body = rows.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
  if (!body.length) return '';
  const [h, ...rest] = body;
  return `<div class="tbl"><table><thead><tr>${cells(h).map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function md(src) {
  if (!String(src || '').trim()) return '<p class="mute">Empty note. Switch to Edit to write.</p>';
  const L = src.split('\n'), out = [];
  const LIST = /^\s*([-*]|\d+\.)\s+/;
  const STOP = /^(#{1,4}\s|```|\s*\$\$|\s*\||\s*>|\s*([-*]|\d+\.)\s+|\s*(---|\*\*\*)\s*$)/;
  let i = 0;
  while (i < L.length) {
    const l = L[i]; let m;
    if (/^```/.test(l)) { const buf = []; i++; while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const h = Math.min(m[1].length + 1, 4); out.push(`<h${h}>${inline(m[2])}</h${h}>`); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if ((m = l.match(/^\s*\$\$(.+)\$\$\s*$/))) { out.push(`<div class="mx mxb">${mathHtml(m[1].trim())}</div>`); i++; continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]); out.push(mdTable(rows)); continue; }
    if (/^\s*>/.test(l)) { const buf = []; while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, '')); out.push(`<blockquote>${buf.map(inline).join('<br>')}</blockquote>`); continue; }
    if (LIST.test(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && LIST.test(L[i])) {
        const raw = L[i].replace(LIST, ''); const cb = raw.match(/^\[( |x|X)\]\s*(.*)/);
        items.push(cb ? `<li class="cb"><button class="mdcb${cb[1] !== ' ' ? ' on' : ''}" data-act="md-check" data-line="${i}" aria-label="Toggle checklist item" aria-pressed="${cb[1] !== ' '}">${cb[1] !== ' ' ? I.tick : ''}</button><span class="${cb[1] !== ' ' ? 'struck' : ''}">${inline(cb[2])}</span></li>` : `<li>${inline(raw)}</li>`);
        i++;
      }
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [l]; i++;
    while (i < L.length && L[i].trim() && !STOP.test(L[i])) buf.push(L[i++]);
    out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

function buildGraph() {

  const shown = p => !(p && hidden.has(p.id));

  folders.forEach(fo => add('f:' + fo.id, 'folder', fo.name || 'Untitled', fColor(fo) || 'var(--acc)', fo));
  folders.forEach(fo => { if (fParent(fo)) link('f:' + fo.id, 'f:' + fo.parent_id, 'folder'); else if (fo.project_id) link('f:' + fo.id, 'p:' + fo.project_id, 'folder'); });

/* ---- stats ---- */
function viewStats() {
  const t = today(), goal = +store.meta.goal || 5;
  const done = all('tasks').filter(x => x.done && x.done_at);
  const byDay = new Map(); done.forEach(x => { const k = doneDay(x); byDay.set(k, (byDay.get(k) || 0) + 1); });
  let days, prev;
  if (S.statsRange === 'week') { const mon = addDays(t, -((parseKey(t).getDay() + 6) % 7)); days = [...Array(7)].map((_, i) => addDays(mon, i)); prev = days.map(k => addDays(k, -7)); }
  else { days = [...Array(30)].map((_, i) => addDays(t, i - 29)); prev = days.map(k => addDays(k, -30)); }
  const sum = ds => ds.reduce((a, k) => a + (byDay.get(k) || 0), 0);
  const n = sum(days), pn = sum(prev), diff = n - pn;
  let streak = 0, k = t; if (!byDay.get(k)) k = addDays(k, -1); while (byDay.get(k)) { streak++; k = addDays(k, -1); }
  let best = 0, run = 0, last = null; [...byDay.keys()].sort().forEach(d => { run = last && addDays(last, 1) === d ? run + 1 : 1; best = Math.max(best, run); last = d; });

  const onTime = dueDone.filter(x => doneDay(x) <= x.due).length; const pct = dueDone.length ? Math.round(onTime / dueDone.length * 100) : null;
  const vals = days.map(d => byDay.get(d) || 0); const max = Math.max(goal, ...vals, 1); const H = 132;
  const maxV = Math.max(...vals);
  const bars = days.map((d, i) => { const v = vals[i]; const show = v && (v === maxV || d === t); return `<div class="bar-col" title="${fmtShort(d)}: ${v} done"><span class="bv${show ? ' show' : ''}">${v}</span><i class="${d === t ? 'today' : ''}" style="height:${Math.round(v / max * H)}px"></i></div>`; }).join('');
  const xl = days.map((d, i) => `<span class="${d === t ? 't' : ''}">${S.statsRange === 'week' ? WD[parseKey(d).getDay()] : (i % 5 === 4 || d === t ? parseKey(d).getDate() : '')}</span>`).join('');
  const per = new Map(); done.filter(x => inRange.has(doneDay(x))).forEach(x => per.set(x.project_id || '', (per.get(x.project_id || '') || 0) + 1));
  const rows = [...per.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8); const pmax = rows.length ? rows[0][1] : 1;
  const label = `Tasks completed per day: ${days.map((d, i) => `${fmtShort(d)} ${vals[i]}`).join(', ')}. Daily goal ${goal}.`;
  return `<div class="page">
<div class="hdr"><h1 class="title">Stats</h1><div class="seg"><button class="${S.statsRange === 'week' ? 'on' : ''}" data-act="stats-range" data-v="week">Week</button><button class="${S.statsRange === 'month' ? 'on' : ''}" data-act="stats-range" data-v="month">30 days</button></div></div>
<div class="tiles">
<div class="card tile"><span class="tl">Done</span><span class="tv">${n}</span><span class="ts">${diff === 0 ? 'Same as before' : (diff > 0 ? '+' : '') + diff + ' vs previous'}</span></div>
<div class="card tile"><span class="tl">Streak</span><span class="tv">${streak}<small> ${streak === 1 ? 'day' : 'days'}</small></span><span class="ts">Best ${best}</span></div>
<div class="card tile"><span class="tl">On time</span><span class="tv">${pct == null ? '–' : pct + '%'}</span><span class="ts">${pct == null ? 'No dated tasks yet' : (dueDone.length - onTime) + ' late'}</span></div>
</div>
<section class="card chart-card"><div class="chart-h"><h2>Completed per day</h2><span class="small mute">Goal ${goal} / day</span></div>
<div class="chart" role="img" aria-label="${esc(label)}"><div class="goal" style="bottom:${Math.round(goal / max * H)}px"><span>Goal</span></div>${bars}</div><div class="xl" aria-hidden="true">${xl}</div></section>
<section class="card chart-card"><div class="chart-h"><h2>By project</h2><span class="small mute">${S.statsRange === 'week' ? 'This week' : 'Last 30 days'}</span></div>
${rows.length ? rows.map(([pid, v]) => { const p = get('projects', pid); return `<div class="hb"><span class="hn"><span class="dot" style="background:${esc(p?.color || '#A1A1AA')}"></span>${esc(p ? p.name : 'No project')}</span><div class="ht"><i style="width:${Math.round(v / pmax * 100)}%"></i></div><span class="hv">${v}</span></div>`; }).join('') : '<p class="small mute" style="margin:0">Complete some tasks to see this.</p>'}
</section></div>`;
}

/* ============ shell ============ */
function navCounts() {
  const t = today(), ts = openTasks();
  return { today: ts.filter(x => x.due && x.due <= t).length, upcoming: ts.filter(x => x.due && x.due > t && x.due <= addDays(t, 7)).length, notes: all('notes').length };
}

  const c = navCounts();
  const act = { today: 'today', upcoming: 'upcoming', projects: 'projects', project: 'projects', notes: 'notes', note: 'notes', graph: 'graph', stats: 'stats', train: 'train', settings: 'settings', search: 'search' }[r.v];
  const item = (k, href, icon, label, cnt = '') => `<a class="${act === k ? 'on' : ''}" href="${href}">${icon}<span class="lbl">${label}</span><span class="cnt">${cnt || ''}</span></a>`;
  const ts = openTasks();
  return `<div class="brand"><span class="logo">${I.tick}</span>${APP}</div>
<label class="search"><span style="display:flex">${I.search}</span><input id="side-q" data-input="q" value="${esc(S.q)}" placeholder="Search" aria-label="Search tasks and notes"><kbd>Ctrl K</kbd></label>
<nav class="nav" aria-label="Main">${item('today', '#today', I.today, 'Today', c.today)}${item('upcoming', '#upcoming', I.upcoming, 'Upcoming', c.upcoming)}${item('projects', '#projects', I.projects, 'Projects')}${item('notes', '#notes', I.notes, 'Notes', c.notes)}${item('graph', '#graph', I.graph, 'Graph')}${item('train', '#train', I.train, 'Train', trainDueAll() || '')}${item('stats', '#stats', I.stats, 'Stats')}</nav>

function renderTabbar(r) {
  const act = { today: 'today', upcoming: 'upcoming', projects: 'projects', project: 'projects', notes: 'notes', note: 'notes', graph: 'notes', stats: 'stats', train: 'train' }[r.v];
  return [['today', 'Today', I.today], ['upcoming', 'Upcoming', I.upcoming], ['projects', 'Projects', I.projects], ['notes', 'Notes', I.notes], ['train', 'Train', I.train], ['stats', 'Stats', I.stats]]

let pendingRender = false;
function typing() { const a = document.activeElement; return a && a.matches && a.matches('input:not([type=checkbox]):not([type=file]),textarea,select'); }
function render(force) {
  if (!force && typing()) { pendingRender = true; return; }
  pendingRender = false;
  const ae = document.activeElement, fid = ae && ae.id, ss = ae && ae.selectionStart, se = ae && ae.selectionEnd;
  if (G) { cancelAnimationFrame(G.raf); G = null; }
  const r = route();
  const views = { today: viewToday, upcoming: viewUpcoming, projects: viewProjects, project: () => viewProject(r.a, r.b), notes: () => viewNotes(null), note: () => viewNotes(r.a), graph: () => viewGraph(r.a), stats: viewStats, train: () => viewTrain(r.a), settings: viewSettings, search: viewSearch };
  $('#main').innerHTML = (views[r.v] || viewToday)();
  $('#sidebar').innerHTML = renderSidebar(r);
  $('#tabbar').innerHTML = renderTabbar(r);
  document.title = APP;
  document.body.classList.toggle('on-graph', r.v === 'graph');
  renderPomo();
  if (r.v === 'graph') initGraph();
  document.querySelectorAll('textarea.ed-body').forEach(autoGrow);
  if (S.focusTitle && $('#ed-title')) { const el = $('#ed-title'); el.focus(); el.select(); S.focusTitle = null; }
  else if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch { } } }
}
// Plays the entry animation (fade + stagger) for the next renders after a route change.
let enterTimer;
function enterAnim() { const h = document.documentElement; h.dataset.enter = ''; clearTimeout(enterTimer); enterTimer = setTimeout(() => delete h.dataset.enter, 650); }
const motionOn = () => themePrefs().motion !== 'off' && !matchMedia('(prefers-reduced-motion: reduce)').matches;
// Runs fn inside a View Transition (smooth morph between old and new screen). fn always runs exactly once,
// even if the browser skips or stalls the transition.
function withTransition(fn, after) {
  let ran = false; const run = () => { if (!ran) { ran = true; fn(); } };
  if (!document.startViewTransition || !motionOn()) { run(); after && after(); return; }
  try { const t = document.startViewTransition(run); t.finished.catch(() => { }).finally(() => after && after()); } catch { run(); after && after(); }
  setTimeout(run, 400);
}
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight, window.innerHeight * 0.5) + 'px'; }

{ const shut = dlg.close.bind(dlg); dlg.close = v => { if (!dlg.open || dlg.classList.contains('closing')) return; if (!motionOn()) return shut(v); dlg.classList.add('closing'); setTimeout(() => { dlg.classList.remove('closing'); shut(v); }, 190); }; }
let toastTimer;
function toast(text, undo) {
  const el = $('#toast'); clearTimeout(toastTimer);
  el.innerHTML = `<span>${esc(text)}</span>${undo ? '<button data-act="undo">Undo</button>' : ''}`;
  el.classList.remove('out');
  toast.undo = undo; toastTimer = setTimeout(() => { el.classList.add('out'); toastTimer = setTimeout(() => { el.innerHTML = ''; el.classList.remove('out'); toast.undo = null; }, 280); }, 4500);
}

  const opt = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`;
  openDlg(`<form class="dlg-form" data-form="task" data-id="${id}"><h2>Edit task</h2>
<label class="fld">Title<input name="title" value="${esc(x.title)}" required></label>
<div class="fld-row"><label class="fld">Date<input type="date" name="due" value="${x.due || ''}"></label><label class="fld">Time<input type="time" name="due_time" value="${x.due_time || ''}"></label></div>
<div class="fld-row"><label class="fld">Priority<select name="priority">${[1, 2, 3, 4].map(p => opt(p, p === 4 ? 'None' : 'P' + p, x.priority || 4)).join('')}</select></label>
<label class="fld">Repeat<select name="recur">${[['', 'Never'], ['daily', 'Every day'], ['weekdays', 'Weekdays'], ['weekly', 'Every week'], ['monthly', 'Every month']].map(([v, l]) => opt(v, l, x.recur || '')).join('')}</select></label></div>
<label class="fld">Project<select name="project_id">${opt('', 'No project', x.project_id || '')}${sortedProjects().map(p => opt(p.id, p.name, x.project_id)).join('')}</select></label>
<label class="fld">Section<input name="section" list="dl-sec" value="${esc(x.section || '')}" placeholder="e.g. Core loop"><datalist id="dl-sec">${sections.map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
<label class="fld">Linked note<select name="note_id">${opt('', 'None', x.note_id || '')}${notes.map(n => opt(n.id, n.title || 'Untitled', x.note_id)).join('')}</select></label>
