/* ============ actions ============ */
function toggleTask(id, now) {
  const x = get('tasks', id); if (!x) return;
  if (x.done) { update('tasks', id, { done: false, done_at: null }); return; }
  // fluid: the ring fills, then rows glide to their new places (a list that hides done tasks lets this one fade out)
  const row = !now && motionOn() && document.querySelector(`.check[data-id="${id}"]`)?.closest('.task');
  if (row && !row.classList.contains('checking')) {
    row.classList.add('checking');
    setTimeout(() => {
      document.querySelectorAll('.task .check[data-id]').forEach(c => { c.closest('.task').style.viewTransitionName = 't-' + c.dataset.id; });
      S.vtTasks = true; setTimeout(() => { S.vtTasks = false; }, 1200);
      withTransition(() => toggleTask(id, true), () => { S.vtTasks = false; });
    }, 240);
    return;
  }
  let next = null;
  if (x.recur && x.due) {
    let nd = nextDue(x.due, x.recur); while (nd < today()) nd = nextDue(nd, x.recur);
    next = create('tasks', { title: x.title, project_id: x.project_id, priority: x.priority, section: x.section, note_id: x.note_id, due_time: x.due_time, recur: x.recur, due: nd, done: false, done_at: null }, false);
  }
  const before = { ...x };
  if (!now) { S.pop = id; setTimeout(() => { if (S.pop === id) S.pop = null; }, 700); }
  update('tasks', id, { done: true, done_at: nowISO(), recur: '' });
  toast(next ? `Done · next on ${fmtShort(next.due)}` : 'Task done', () => { update('tasks', id, { done: false, done_at: null, recur: before.recur }); if (next) removeRow('tasks', next.id); });
}
function newNote(project_id, folder_id) {
  const fo = get('folders', folder_id);
  if (fo) S.closed.delete('f:' + fo.id);
  const n = create('notes', { project_id: fo ? fProject(fo)?.id || null : project_id || null, folder_id: fo ? fo.id : null, folder: '', title: 'Untitled', body: '', pinned: false }, false);
  S.nmodeFor = n.id; S.nmode = 'edit'; S.focusTitle = n.id;
  if (location.hash === '#note/' + n.id) render(true); else location.hash = '#note/' + n.id;
}
function openWiki(title) {
  let n = noteByTitle(title);
  if (!n) {
    const cur = route().v === 'note' ? get('notes', route().a) : null;
    n = create('notes', { title: title.trim(), project_id: cur?.project_id || null, folder_id: cur?.folder_id || null, folder: '', body: '', pinned: false }, false);
    S.nmodeFor = n.id; S.nmode = 'edit';
  }
  if (route().v === 'graph') { S.g.sel = 'n:' + n.id; render(true); return; }
  location.hash = '#note/' + n.id;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  const fn = ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', async e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === 'quick') {
    const q = f.q.value.trim(); if (!q) return;
    const r = parseQuick(q, { due: f.dataset.due, project_id: f.dataset.project || null });
    if (!r.title) return;
    create('tasks', { ...r, note_id: f.dataset.note || null, section: f.dataset.section || '', done: false, done_at: null });
    const el = $('#qa'); if (el) el.value = '';
  } else if (kind === 'task') {
    const d = Object.fromEntries(new FormData(f));
    update('tasks', f.dataset.id, { title: d.title.trim(), due: d.due || '', due_time: d.due_time || '', priority: +d.priority, recur: d.recur, project_id: d.project_id || null, section: d.section.trim(), note_id: d.note_id || null });
    dlg.close();
  } else if (kind === 'folder') {
    const d = Object.fromEntries(new FormData(f));

    const d = pipWin.document;
    d.documentElement.style.cssText = document.documentElement.style.cssText;
    if (!d.activeElement || d.activeElement.tagName !== 'SELECT') d.body.innerHTML = pomoCard();
  }
  pomoPaint();
}
function pomoPaint() {
  const left = pomoLeft(), txt = mmss(left), pct = (1 - left / pomoDur(P.mode)) * 100 + '%';
  pomoDocs().forEach(d => {
    d.querySelectorAll('[data-pomo-time],[data-pomo-fab]').forEach(e => { e.textContent = txt; });
    d.querySelectorAll('[data-pomo-bar]').forEach(e => { e.style.width = pct; });
  });
  if (P.endsAt) document.title = `${txt} · ${P.mode === 'focus' ? 'Focus' : 'Break'}`;
  if (pipWin) pipWin.document.title = P.endsAt ? `${txt} · Knot` : 'Knot timer';
}
async function pomoPop() {
  if (pipWin) { pipWin.focus(); return; }
  try { pipWin = await documentPictureInPicture.requestWindow({ width: 300, height: 330 }); }
  catch (e) { toast('Could not pop out: ' + e.message); return; }
  const d = pipWin.document;
  document.querySelectorAll('style, link[rel=stylesheet]').forEach(n => d.head.appendChild(n.cloneNode(true)));
  d.body.className = 'pip';
  d.addEventListener('click', e => { const el = e.target.closest('[data-act]'); const fn = el && ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
  d.addEventListener('change', e => { if (e.target.dataset.change === 'pomo-task') { P.taskId = e.target.value; pomoSave(); } });
  pipWin.addEventListener('pagehide', () => { pipWin = null; renderPomo(); });
  P.open = false; renderPomo();
}
// close the timer card when clicking elsewhere in the app
document.addEventListener('click', e => { if (P.open && !e.target.closest('#pomo') && document.contains(e.target)) { P.open = false; renderPomo(); } });
if (P.endsAt) { if (pomoLeft() > 0) pomoTicker(true); else setTimeout(() => pomoNext(true), 0); }

/* ============ boot ============ */
render(true);
sync.init();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
